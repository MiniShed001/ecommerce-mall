# 全栈电商 Nginx 配置
# 链路：浏览器 -> Nginx(8080) 静态前端 + /api 反向代理 -> Django/waitress(8000) -> Redis(6379) -> DB
worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       D:/ecommerce/tools/nginx/conf/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen       8080;
        server_name  localhost;

        # UniApp H5 构建产物
        root  D:/ecommerce/frontend/dist/build/h5;
        index index.html;

        # 后端 API 反向代理 -> Django(waitress) 127.0.0.1:8000
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Admin
        location /admin/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Django 静态资源（admin 样式）
        location /static/ {
            alias D:/ecommerce/backend/staticfiles/;
        }

        # 上传文件
        location /media/ {
            alias D:/ecommerce/backend/media/;
        }

        # 单页应用 fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
